name: Build and Test CBMC
# Temporarily heavily trimmed while debugging long-double layout issue on
# PR 9020.  The full file (with all other build matrix jobs) is preserved
# at .github/workflows/pull-request-checks.yaml.full and will be restored
# once the underlying x86_64 long double bug is fixed.
on:
  push:
    branches: [ '**' ]
  pull_request:
    branches: [ develop ]
env:
  cvc5-version: "1.3.4"
  z3-version: "4.8.10"

jobs:

  # ────────────────────────────────────────────────────────────────────
  # macOS 15 on Intel — the originally failing job.  We collect a set of
  # diagnostic artifacts that pin down the SDK code path and the actual
  # hardware byte layout of `long double`, then run only the signbit
  # regression test (the rest of the suite is irrelevant for this debug
  # iteration).
  # ────────────────────────────────────────────────────────────────────
  debug-macos-15-intel:
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
      - name: Fetch dependencies
        run: |
          brew install flex bison ccache
      - name: Build cbmc and goto-instrument with Make
        run: |
          make -C src minisat2-download
          make -C src cbmc.dir goto-instrument.dir goto-cc.dir -j4 \
            CXX="ccache clang++" MINISAT2=../../minisat-2.2.1
      - name: Collect environment / SDK / hardware facts
        if: always()
        run: |
          mkdir -p debug-artifacts

          # 1. uname / xcrun / clang version
          {
            echo '== uname -a =='
            uname -a
            echo
            echo '== xcrun --show-sdk-path =='
            xcrun --show-sdk-path
            echo
            echo '== clang --version =='
            clang --version
          } > debug-artifacts/01_environment.txt 2>&1

          # 2. macOS deployment / availability macros
          cat > /tmp/check_env.c <<'EOF'
          #include <Availability.h>
          #include <stdio.h>
          int main(void) {
          #ifdef __ENVIRONMENT_OS_VERSION_MIN_REQUIRED__
            printf("__ENVIRONMENT_OS_VERSION_MIN_REQUIRED__ = %d\n",
                   __ENVIRONMENT_OS_VERSION_MIN_REQUIRED__);
          #else
            printf("__ENVIRONMENT_OS_VERSION_MIN_REQUIRED__ = (undefined)\n");
          #endif
          #ifdef __MAC_OS_X_VERSION_MIN_REQUIRED
            printf("__MAC_OS_X_VERSION_MIN_REQUIRED        = %d\n",
                   __MAC_OS_X_VERSION_MIN_REQUIRED);
          #endif
          #ifdef MAC_OS_X_VERSION_MIN_REQUIRED
            printf("MAC_OS_X_VERSION_MIN_REQUIRED          = %d\n",
                   MAC_OS_X_VERSION_MIN_REQUIRED);
          #endif
            printf("__LDBL_MANT_DIG__   = %d\n", __LDBL_MANT_DIG__);
            printf("__LDBL_MIN_EXP__    = %d\n", __LDBL_MIN_EXP__);
            printf("__LDBL_MAX_EXP__    = %d\n", __LDBL_MAX_EXP__);
            printf("sizeof(long double) = %zu bytes\n", sizeof(long double));
            return 0;
          }
          EOF
          clang /tmp/check_env.c -o /tmp/check_env
          /tmp/check_env > debug-artifacts/02_long_double_macros.txt

          # 3. Native byte representation of -1.0L on real hardware
          cat > /tmp/bytes.c <<'EOF'
          #include <stdio.h>
          int main(void) {
            union {
              long double ld;
              unsigned char b[sizeof(long double)];
            } u;
            const long double values[] = { -1.0L, 1.0L, -2.0L, 0.0L, -0.0L };
            const char *names[] = { "-1.0L", "1.0L", "-2.0L", "0.0L", "-0.0L" };
            for (size_t i = 0; i < sizeof(values)/sizeof(values[0]); ++i) {
              u.ld = values[i];
              printf("%-6s bytes (LE):", names[i]);
              for (size_t j = 0; j < sizeof(long double); ++j)
                printf(" %02x", u.b[j]);
              printf("\n");
            }
            return 0;
          }
          EOF
          clang -O0 /tmp/bytes.c -o /tmp/bytes
          /tmp/bytes > debug-artifacts/03_native_long_double_bytes.txt

          # 4. Show real SDK signbit body via the same union the test uses.
          cat > /tmp/native_signbit.c <<'EOF'
          #include <math.h>
          #include <stdio.h>
          int main(void) {
            long double x = -1.0L;
            printf("signbit(-1.0L) on real hardware = %d (expected 1)\n",
                   signbit(x));
            x = 1.0L;
            printf("signbit( 1.0L) on real hardware = %d (expected 0)\n",
                   signbit(x));
            return 0;
          }
          EOF
          clang -O0 /tmp/native_signbit.c -o /tmp/native_signbit
          /tmp/native_signbit > debug-artifacts/04_native_signbit.txt

          # 5. Preprocessed regression test source (shows the SDK
          # __inline_signbit* bodies after macro expansion).
          clang -E regression/cbmc-library/signbit/main.c \
            > debug-artifacts/05_signbit_preprocessed.c 2>&1 || true

          # 6. Reproduce the cbmc behaviour and capture the trace.  Use the
          # just-built make binary at src/cbmc/cbmc.
          src/cbmc/cbmc regression/cbmc-library/signbit/main.c \
            --floatbv --no-simplify --trace \
            > debug-artifacts/06_cbmc_trace.txt 2>&1 || true

          # 7. Show the goto-functions for the __inline_signbit* helpers.
          src/cbmc/cbmc regression/cbmc-library/signbit/main.c \
            --floatbv --no-simplify --show-goto-functions \
            > debug-artifacts/07_goto_functions.txt 2>&1 || true

          # 8. A direct CBMC repro that reads the union by hand, so the
          # trace shows exactly what bytes CBMC stores for `-1.0L`.
          cat > /tmp/repro.c <<'EOF'
          int main(void) {
            union {
              long double __ld;
              struct {
                unsigned long long __m;
                unsigned short __sexp;
              } __p;
            } __u;
            __u.__ld = -1.0L;
            __CPROVER_assert(__u.__p.__m == 0x8000000000000000ull,
                             "__m == 0x8000000000000000 (explicit integer bit)");
            __CPROVER_assert(__u.__p.__sexp == 0xBFFF,
                             "__sexp == 0xBFFF (sign + biased exp for -1.0L)");
            __CPROVER_assert((__u.__p.__sexp >> 15) == 1,
                             "sign bit is 1 for -1.0L");
            return 0;
          }
          EOF
          src/cbmc/cbmc /tmp/repro.c \
            --floatbv --no-simplify --trace \
            > debug-artifacts/08_cbmc_layout_repro.txt 2>&1 || true
      - name: Run signbit regression test only
        if: always()
        run: |
          cd regression/cbmc-library
          ../test.pl -e -p -c "../../../src/cbmc/cbmc --validate-goto-model --validate-ssa-equation" signbit \
            > /tmp/signbit_test.log 2>&1 || true
          cp /tmp/signbit_test.log ../../debug-artifacts/09_signbit_test_run.txt
          cp signbit/test.out ../../debug-artifacts/10_signbit_test_out.txt 2>/dev/null || true
      - name: Upload debug artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: debug-macos-15-intel
          path: debug-artifacts/

  # ────────────────────────────────────────────────────────────────────
  # macOS 14 on Apple Silicon — control case (long double is 64-bit
  # double on this architecture; the test passes today).  Same set of
  # diagnostic artifacts so we can compare against the Intel run.
  # ────────────────────────────────────────────────────────────────────
  debug-macos-14-arm:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
      - name: Fetch dependencies
        run: brew install ninja flex bison ccache
      - name: Configure and build cbmc with CMake
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER=/usr/bin/clang \
            -DCMAKE_CXX_COMPILER=/usr/bin/clang++ \
            -Dsat_impl=cadical
          ninja -C build cbmc -j3
      - name: Collect environment / SDK / hardware facts
        if: always()
        run: |
          mkdir -p debug-artifacts

          {
            echo '== uname -a =='
            uname -a
            echo
            echo '== xcrun --show-sdk-path =='
            xcrun --show-sdk-path
            echo
            echo '== clang --version =='
            clang --version
          } > debug-artifacts/01_environment.txt 2>&1

          cat > /tmp/check_env.c <<'EOF'
          #include <Availability.h>
          #include <stdio.h>
          int main(void) {
          #ifdef __ENVIRONMENT_OS_VERSION_MIN_REQUIRED__
            printf("__ENVIRONMENT_OS_VERSION_MIN_REQUIRED__ = %d\n",
                   __ENVIRONMENT_OS_VERSION_MIN_REQUIRED__);
          #endif
          #ifdef __MAC_OS_X_VERSION_MIN_REQUIRED
            printf("__MAC_OS_X_VERSION_MIN_REQUIRED        = %d\n",
                   __MAC_OS_X_VERSION_MIN_REQUIRED);
          #endif
            printf("__LDBL_MANT_DIG__   = %d\n", __LDBL_MANT_DIG__);
            printf("__LDBL_MIN_EXP__    = %d\n", __LDBL_MIN_EXP__);
            printf("__LDBL_MAX_EXP__    = %d\n", __LDBL_MAX_EXP__);
            printf("sizeof(long double) = %zu bytes\n", sizeof(long double));
            return 0;
          }
          EOF
          clang /tmp/check_env.c -o /tmp/check_env
          /tmp/check_env > debug-artifacts/02_long_double_macros.txt

          cat > /tmp/bytes.c <<'EOF'
          #include <stdio.h>
          int main(void) {
            union {
              long double ld;
              unsigned char b[sizeof(long double)];
            } u;
            const long double values[] = { -1.0L, 1.0L, -2.0L, 0.0L, -0.0L };
            const char *names[] = { "-1.0L", "1.0L", "-2.0L", "0.0L", "-0.0L" };
            for (size_t i = 0; i < sizeof(values)/sizeof(values[0]); ++i) {
              u.ld = values[i];
              printf("%-6s bytes (LE):", names[i]);
              for (size_t j = 0; j < sizeof(long double); ++j)
                printf(" %02x", u.b[j]);
              printf("\n");
            }
            return 0;
          }
          EOF
          clang -O0 /tmp/bytes.c -o /tmp/bytes
          /tmp/bytes > debug-artifacts/03_native_long_double_bytes.txt

          clang -E regression/cbmc-library/signbit/main.c \
            > debug-artifacts/05_signbit_preprocessed.c 2>&1 || true

          build/bin/cbmc regression/cbmc-library/signbit/main.c \
            --floatbv --no-simplify --trace \
            > debug-artifacts/06_cbmc_trace.txt 2>&1 || true

          build/bin/cbmc regression/cbmc-library/signbit/main.c \
            --floatbv --no-simplify --show-goto-functions \
            > debug-artifacts/07_goto_functions.txt 2>&1 || true
      - name: Upload debug artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: debug-macos-14-arm
          path: debug-artifacts/
