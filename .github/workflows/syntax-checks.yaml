name: Syntactic checks
on:
  pull_request:
    branches: [ develop ]

jobs:
  # This job takes approximately 1 minute
  check-clang-format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
          fetch-depth: 0
      - name: Fetch dependencies
        env:
          # This is needed in addition to -yq to prevent apt-get from asking for
          # user input
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -yq clang-format-15
      - name: Check updated lines of code match clang-format-15 style
        env:
          BASE_BRANCH: ${{ github.base_ref }}
          MERGE_BRANCH: ${{ github.ref }}
        run: ./.github/workflows/pull-request-check-clang-format.sh

  # This job takes approximately 1 minute
  check-cpplint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
          fetch-depth: 0
      - name: Fetch dependencies
        env:
          # This is needed in addition to -yq to prevent apt-get from asking for
          # user input
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -yq python3-unidiff
      - name: Check updated lines of code meet linting standards
        env:
          BASE_BRANCH: ${{ github.base_ref }}
          MERGE_BRANCH: ${{ github.ref }}
        run: ./.github/workflows/pull-request-check-cpplint.sh

  # This job should take about a minute (est)
  check-rustfmt:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout CBMC repository 
        uses: actions/checkout@v6
      - name: Install latest stable Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal --no-self-update -c clippy -c rustfmt
      - name: Run `cargo fmt` on top of Rust API project
        run: cd src/libcprover-rust; cargo fmt --all -- --check

  # This job takes approximately 3 minutes
  check-irep-copies:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
      - name: Fetch dependencies
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -yq \
            cmake g++ flex bison clang-18 llvm-18-dev libclang-18-dev \
            libclang-cpp18-dev
      - name: Configure
        run: cmake -S . -Bbuild -DCMAKE_EXPORT_COMPILE_COMMANDS=ON
      - name: Check for unnecessary irept copies
        run: ./scripts/run_irep_copies_check.sh build
